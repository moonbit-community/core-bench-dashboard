name: MoonBit Core Benchmark Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-data:
    runs-on: [self-hosted, bench-box]
    steps:
      - uses: actions/checkout@v5

      - name: Clean persistent workspace
        run: rm -rf core data _build .mooncakes dist dashboard

      # The dashboard measures the nightly toolchain, so nightly must not build
      # it: one compiler regression would otherwise take out the measurement and
      # the instrument together, and a red badge could no longer be read as a
      # statement about `moonbitlang/core`. Stable gets its own MOON_HOME, and
      # nightly is installed afterwards so it owns PATH for `moon bench` alone.
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME="$HOME/.moon-stable" bash
          MOON_HOME="$HOME/.moon-stable" "$HOME/.moon-stable/bin/moon" version --all

      - name: Build the dashboard binary
        run: |
          export MOON_HOME="$HOME/.moon-stable"
          export PATH="$MOON_HOME/bin:$PATH"
          # A freshly installed MOON_HOME carries no registry index, and
          # `moon build` will not fetch one: without this the module's
          # dependencies do not resolve at all.
          moon update
          moon build --target native --release
          cp _build/native/release/build/cmd/dashboard/dashboard.exe dashboard

      - name: Install MoonBit nightly
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Clone moonbitlang/core main
        run: git clone --depth 1 --branch main https://github.com/moonbitlang/core core

      - name: Collect benchmark data
        env:
          MOONC_RC_CONVENTION: borrow
        run: |
          ./dashboard collect \
            --core-dir core \
            --os darwin-arm64 \
            --backends wasm,wasm-gc,js,native \
            --out-dir data/core-bench/current/darwin-arm64

      - name: Upload current data
        uses: actions/upload-artifact@v4
        with:
          name: core-bench-current-darwin-arm64
          path: data/core-bench/current/darwin-arm64/
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Install warren
        run: moon install moonbit-community/warren

      - name: Build the dashboard binary
        run: |
          moon build --target native --release
          cp _build/native/release/build/cmd/dashboard/dashboard.exe dashboard

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore published history
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          DEFAULT_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: ./dashboard restore-history "${PAGES_BASE_URL:-$DEFAULT_PAGES_BASE_URL}"

      - name: Organize current data
        run: |
          mkdir -p data/core-bench/current/darwin-arm64
          cp -r artifacts/core-bench-current-darwin-arm64/* data/core-bench/current/darwin-arm64/

      - name: Update retained history
        run: ./dashboard update-history

      - name: Write dashboard status badge
        run: ./dashboard status-badge

      - name: Build the browser bundle
        run: warren build --server-entry ""

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp dist/index.html dist/index.js publish/
          cp -r data publish/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
