name: MoonBit Core Benchmark Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}
  MOONC_RC_CONVENTION: borrow

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install MoonBit nightly
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Clone moonbitlang/core main
        run: git clone --depth 1 --branch main https://github.com/moonbitlang/core core

      - name: Collect benchmark data
        run: |
          deno run -A main.ts collect \
            --core-dir core \
            --os linux-x64 \
            --backends wasm,wasm-gc,js,native \
            --out-dir data/core-bench/current/linux-x64

      - name: Upload current data
        uses: actions/upload-artifact@v4
        with:
          name: core-bench-current-linux-x64
          path: data/core-bench/current/linux-x64/
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore published history
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          DEFAULT_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: deno run -A scripts/restore_history.ts "${PAGES_BASE_URL:-$DEFAULT_PAGES_BASE_URL}"

      - name: Organize current data
        run: |
          mkdir -p data/core-bench/current/linux-x64
          cp -r artifacts/core-bench-current-linux-x64/* data/core-bench/current/linux-x64/

      - name: Update retained history
        run: deno task update-history

      - name: Write dashboard status badge
        run: deno task status-badge

      - name: Bundle web
        run: deno task bundle

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html publish/
          cp web.js publish/
          cp -r data publish/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
