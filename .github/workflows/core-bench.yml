name: MoonBit Core Benchmark Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}

permissions:
  # `contents: write` pushes the benchmark archive to the `bench-data` branch.
  contents: write
  pages: write
  id-token: write

# The archive is force-pushed, so two runs at once would lose a day.
concurrency:
  group: core-bench
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: [self-hosted, bench-box]
    steps:
      - uses: actions/checkout@v5

      - name: Clean persistent workspace
        run: rm -rf core data _build .mooncakes dist dashboard

      # The dashboard measures the nightly toolchain, so nightly must not build
      # it: one compiler regression would otherwise take out the measurement and
      # the instrument together, and a red badge could no longer be read as a
      # statement about `moonbitlang/core`. Stable gets its own MOON_HOME, and
      # nightly is installed afterwards so it owns PATH for `moon bench` alone.
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME="$HOME/.moon-stable" bash
          MOON_HOME="$HOME/.moon-stable" "$HOME/.moon-stable/bin/moon" version --all

      - name: Build the dashboard binary
        run: |
          export MOON_HOME="$HOME/.moon-stable"
          export PATH="$MOON_HOME/bin:$PATH"
          # A freshly installed MOON_HOME carries no registry index, and
          # `moon build` will not fetch one: without this the module's
          # dependencies do not resolve at all.
          moon update
          moon build --target native --release
          cp _build/native/release/build/cmd/dashboard/dashboard.exe dashboard

      - name: Install MoonBit nightly
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Clone moonbitlang/core main
        run: git clone --depth 1 --branch main https://github.com/moonbitlang/core core

      - name: Collect benchmark data
        env:
          MOONC_RC_CONVENTION: borrow
        run: |
          ./dashboard collect \
            --core-dir core \
            --os darwin-arm64 \
            --backends wasm,wasm-gc,js,native \
            --out-dir data/core-bench/current/darwin-arm64

      - name: Upload current data
        uses: actions/upload-artifact@v4
        with:
          name: core-bench-current-darwin-arm64
          path: data/core-bench/current/darwin-arm64/
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Install warren
        run: moon install moonbit-community/warren

      - name: Build the dashboard binary
        run: |
          moon build --target native --release
          cp _build/native/release/build/cmd/dashboard/dashboard.exe dashboard

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The archive holds exactly what was deployed last time. A missing branch
      # is not an error: that is how a new dashboard, or a deliberate break of
      # the history chain, starts over. See docs/operations.md.
      - name: Check out the benchmark archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" bench-data >/dev/null 2>&1; then
            git clone --branch bench-data --single-branch --depth 1 "$remote" data
          else
            echo "bench-data not found; starting a new archive."
            mkdir -p data
          fi

      - name: Organize current data
        run: |
          mkdir -p data/core-bench/current/darwin-arm64
          cp -r artifacts/core-bench-current-darwin-arm64/* data/core-bench/current/darwin-arm64/

      - name: Update retained history
        run: ./dashboard update-history

      - name: Write dashboard status badge
        run: ./dashboard status-badge

      # Force-pushed as an orphan, so the branch stays one tree deep instead of
      # accumulating a megabyte of poorly-diffing JSONL every day. `add -f`
      # because a runner's global gitignore may well exclude `*.log`, and the
      # per-backend logs are part of the archive.
      - name: Publish the benchmark archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf data/.git
          cd data
          git init -q
          git checkout -q --orphan bench-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "core bench run ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench-data

      - name: Build the browser bundle
        run: warren build --server-entry ""

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp dist/index.html dist/index.js publish/
          cp -r data publish/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
